<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ SQL 与全链路性能分析器 (Vue 3)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel-bg: #ffffff;
      --border: #cbd5e1;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --accent-yellow: #d97706;
      --accent-purple: #7c3aed;
      --text: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-y: scroll; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding: 8px 14px;
      font-size: 12px;
    }

    /* 统一全局表格规范 */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-bottom: 6px;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      vertical-align: middle;
      line-height: 1.45;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
      font-size: 11.5px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #cbd5e1;
      white-space: nowrap;
    }
    tr:hover td { background-color: #f1f5f9; }

    /* 统一文本与等宽样式 */
    .col-nowrap { white-space: nowrap; }
    .col-time {
      white-space: nowrap;
      font-size: 11.5px;
      font-family: var(--font-mono);
      color: #334155;
    }
    .col-mono {
      font-family: var(--font-mono);
      font-size: 11.5px;
    }
    .empty-cell {
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      font-size: 12.5px;
    }

    /* 统一交互按钮 */
    .btn-action {
      padding: 2px 7px;
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      line-height: 1.4;
    }
    .btn-action:hover {
      background: #e2e8f0;
      color: var(--accent);
      border-color: #94a3b8;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
      border-color: #0369a1;
    }
    .btn-primary:hover {
      background: #0369a1;
      color: #ffffff;
    }

    /* 统一链接样式 */
    .link-btn {
      color: #0284c7;
      font-weight: 600;
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 11.5px;
    }
    .link-btn:hover {
      text-decoration: underline;
      color: #0369a1;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
